<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conversas | Zvory</title>

    <link rel="stylesheet" href="chat.css">
</head>

<body>

<div class="chat-app">

    <!-- ================= LISTA DE CONVERSAS ================= -->

    <aside class="conversations">

        <div class="conversations-header">
            <div>
                <span class="brand">ZVORY</span>
                <h1>Conversas</h1>
            </div>

            <button class="new-chat" id="newChatBtn" title="Nova conversa">
                +
            </button>
        </div>

        <div class="search-box">
            <span>⌕</span>
            <input
                type="text"
                id="searchInput"
                placeholder="Pesquisar"
                autocomplete="off"
            >
        </div>

        <div class="conversation-list" id="conversationList">

            <button
                class="conversation active"
                data-user="Isabela"
                data-status="online"
            >
                <div class="avatar">
                    I
                    <span class="online"></span>
                </div>

                <div class="conversation-info">
                    <strong>Isabela</strong>
                    <span>Oi ❤️</span>
                </div>

                <time>14:42</time>
            </button>

            <button
                class="conversation"
                data-user="João"
                data-status="offline"
            >
                <div class="avatar">
                    J
                </div>

                <div class="conversation-info">
                    <strong>João</strong>
                    <span>Beleza, depois te falo</span>
                </div>

                <time>13:21</time>
            </button>

            <button
                class="conversation"
                data-user="Maria"
                data-status="online"
            >
                <div class="avatar">
                    M
                    <span class="online"></span>
                </div>

                <div class="conversation-info">
                    <strong>Maria</strong>
                    <span>Enviou uma imagem</span>
                </div>

                <time>11:08</time>
            </button>

        </div>

    </aside>


    <!-- ================= CHAT ================= -->

    <main class="chat">

        <!-- HEADER -->

        <header class="chat-header">

            <button class="back-btn" id="backBtn" aria-label="Voltar">
                ←
            </button>

            <div class="chat-user">

                <div class="avatar large">
                    <span id="headerAvatar">I</span>
                    <span class="online" id="headerOnline"></span>
                </div>

                <div>
                    <strong id="headerName">Isabela</strong>
                    <span id="headerStatus">online</span>
                </div>

            </div>

            <div class="chat-actions">

                <button
                    class="action-btn"
                    id="voiceBtn"
                    title="Chamada de voz"
                >
                    ♫
                </button>

                <button
                    class="action-btn"
                    id="moreBtn"
                    title="Mais opções"
                >
                    ⋮
                </button>

            </div>

        </header>


        <!-- MENSAGENS -->

        <section
            class="messages"
            id="messages"
            aria-label="Mensagens"
        >

            <div class="date-divider">
                <span>Hoje</span>
            </div>

            <div class="message received">
                <div class="bubble">
                    Oii
                </div>

                <span class="message-time">
                    14:40
                </span>
            </div>

            <div class="message sent">
                <div class="bubble">
                    Oii, tudo bem?
                </div>

                <span class="message-time">
                    14:41
                </span>
            </div>

            <div class="message received">
                <div class="bubble">
                    Tudo sim ❤️
                </div>

                <span class="message-time">
                    14:42
                </span>
            </div>

        </section>


        <!-- INPUT -->

        <form class="message-form" id="messageForm">

            <button
                type="button"
                class="input-btn"
                id="attachmentBtn"
                title="Anexar"
            >
                +
            </button>

            <input
                type="text"
                id="messageInput"
                placeholder="Digite uma mensagem..."
                autocomplete="off"
                maxlength="2000"
            >

            <button
                type="button"
                class="input-btn"
                id="emojiBtn"
                title="Emoji"
            >
                ☺
            </button>

            <button
                type="submit"
                class="send-btn"
                title="Enviar"
            >
                ↑
            </button>

        </form>

    </main>

</div>


<!-- ================= MENU ================= -->

<div class="dropdown" id="moreMenu">

    <button id="clearChatBtn">
        Limpar conversa
    </button>

    <button id="blockBtn">
        Bloquear usuário
    </button>

</div>


<script src="chat.js"></script>

</body>
</html>
