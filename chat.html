<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conversas | Zvory</title>

    <link rel="stylesheet" href="chat.css">
</head>

<body>

<div class="chat-app">

    <!-- =====================================================
         LISTA DE CONVERSAS
    ====================================================== -->

    <aside class="conversations">

        <div class="conversations-header">

            <div>
                <span class="brand">ZVORY</span>
                <h1>Conversas</h1>
            </div>

            <button
                class="new-chat"
                id="newChatBtn"
                title="Nova conversa"
                aria-label="Nova conversa"
            >
                +
            </button>

        </div>


        <!-- ================= PESQUISA ================= -->

        <div class="search-box">

            <span>⌕</span>

            <input
                type="text"
                id="searchInput"
                placeholder="Pesquisar conversas"
                autocomplete="off"
            >

        </div>


        <!-- ================= LISTA DE CONVERSAS ================= -->

        <div
            class="conversation-list"
            id="conversationList"
        >

            <!-- ================= ISABELA ================= -->

            <button
                class="conversation active"
                data-user="Isabela"
                data-status="online"
            >

                <div class="avatar">

                    I

                    <span class="online"></span>

                </div>

                <div class="conversation-info">

                    <strong>
                        Isabela
                    </strong>

                    <span>
                        Oi ❤️
                    </span>

                </div>

                <time>
                    14:42
                </time>

            </button>


            <!-- ================= JOÃO ================= -->

            <button
                class="conversation"
                data-user="João"
                data-status="offline"
            >

                <div class="avatar">
                    J
                </div>

                <div class="conversation-info">

                    <strong>
                        João
                    </strong>

                    <span>
                        Beleza, depois te falo
                    </span>

                </div>

                <time>
                    13:21
                </time>

            </button>


            <!-- ================= MARIA ================= -->

            <button
                class="conversation"
                data-user="Maria"
                data-status="online"
            >

                <div class="avatar">

                    M

                    <span class="online"></span>

                </div>

                <div class="conversation-info">

                    <strong>
                        Maria
                    </strong>

                    <span>
                        Enviou uma imagem
                    </span>

                </div>

                <time>
                    11:08
                </time>

            </button>

        </div>

    </aside>


    <!-- =====================================================
         CHAT PRINCIPAL
    ====================================================== -->

    <main class="chat">


        <!-- ================= HEADER ================= -->

        <header class="chat-header">

            <button
                class="back-btn"
                id="backBtn"
                aria-label="Voltar"
            >
                ←
            </button>


            <div class="chat-title">

                <span>
                    CONVERSA
                </span>

                <strong>
                    Zvory Chat
                </strong>

            </div>


            <div class="chat-actions">

                <button
                    class="action-btn"
                    id="voiceBtn"
                    title="Chamada de voz"
                    aria-label="Chamada de voz"
                >
                    ♫
                </button>

                <button
                    class="action-btn"
                    id="moreBtn"
                    title="Mais opções"
                    aria-label="Mais opções"
                >
                    ⋮
                </button>

            </div>

        </header>


        <!-- =====================================================
             CONTEÚDO
        ====================================================== -->

        <div class="chat-content">


            <!-- =================================================
                 TÍTULO DAS MENSAGENS
            ================================================== -->

            <div class="messages-title">

                <div>

                    <span>
                        CONVERSA ATIVA
                    </span>

                    <h2>
                        Mensagens
                    </h2>

                </div>


                <span class="message-count">
                    CHAT
                </span>

            </div>


            <!-- =================================================
                 MENSAGENS
            ================================================== -->

            <section
                class="messages"
                id="messages"
                aria-label="Mensagens"
            >


                <!-- ================= DATA ================= -->

                <div class="date-divider">

                    <span>
                        Hoje
                    </span>

                </div>


                <!-- =================================================
                     MENSAGEM RECEBIDA
                ================================================== -->

                <div class="message received">

                    <div class="message-avatar">
                        I
                    </div>

                    <div class="message-body">

                        <strong class="message-author">
                            Isabela
                        </strong>

                        <div class="bubble">
                            Oii
                        </div>

                        <span class="message-time">
                            14:40
                        </span>

                    </div>

                </div>


                <!-- =================================================
                     MENSAGEM ENVIADA
                ================================================== -->

                <div class="message sent">

                    <div class="message-body">

                        <div class="bubble">
                            Oii, tudo bem?
                        </div>

                        <span class="message-time">
                            14:41
                        </span>

                    </div>

                </div>


                <!-- =================================================
                     MENSAGEM RECEBIDA
                ================================================== -->

                <div class="message received">

                    <div class="message-avatar">
                        I
                    </div>

                    <div class="message-body">

                        <strong class="message-author">
                            Isabela
                        </strong>

                        <div class="bubble">
                            Tudo sim ❤️
                        </div>

                        <span class="message-time">
                            14:42
                        </span>

                    </div>

                </div>

            </section>

        </div>


        <!-- =====================================================
             CAMPO DE MENSAGEM
        ====================================================== -->

        <form
            class="message-form"
            id="messageForm"
        >

            <!-- ANEXAR -->

            <button
                type="button"
                class="input-btn"
                id="attachmentBtn"
                title="Anexar"
                aria-label="Anexar"
            >
                +
            </button>


            <!-- INPUT -->

            <input
                type="text"
                id="messageInput"
                placeholder="Digite uma mensagem..."
                autocomplete="off"
                maxlength="2000"
            >


            <!-- EMOJI -->

            <button
                type="button"
                class="input-btn"
                id="emojiBtn"
                title="Emoji"
                aria-label="Emoji"
            >
                ☺
            </button>


            <!-- ENVIAR -->

            <button
                type="submit"
                class="send-btn"
                title="Enviar"
                aria-label="Enviar mensagem"
            >
                ↑
            </button>

        </form>

    </main>

</div>


<!-- =========================================================
     MENU DE OPÇÕES
========================================================= -->

<div
    class="dropdown"
    id="moreMenu"
>

    <button id="clearChatBtn">
        Limpar conversa
    </button>

    <button id="blockBtn">
        Bloquear usuário
    </button>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="chat.js"></script>

</body>

</html>
