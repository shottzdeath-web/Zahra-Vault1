<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Cadastro | Zahra Vault</title>
</head>

<body>

    <main class="login-page">

        <div class="login-box">

            <h1 class="chrome-text">Zahra Vault</h1>

            <p>Crie sua conta</p>


            <form>

                <label for="username">
                    Nome de usuário
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Seu nome"
                    required
                >


                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                >


                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Sua senha"
                    required
                >


                <label for="confirm-password">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirme sua senha"
                    required
                >


                <button type="submit">
                    Criar conta
                </button>

            </form>


            <p>
                Já possui uma conta?
                <a href="login.html">Entrar.</a>
            </p>


            <a href="index.html">
                Voltar para o início
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
