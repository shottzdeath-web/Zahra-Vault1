<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Login | Zvory Vault</title>
</head>

<body>

    <main class="login-page">

        <div class="login-box">

            <h1>Zvory Vault</h1>

            <p>Entre na sua conta</p>


            <form id="loginForm">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                >


                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Sua senha"
                    required
                >


                <button type="submit">
                    Entrar
                </button>

            </form>

    <p>Não possui uma conta? 
    <a href="cadastro.html">Cadastrar.</a>
    
    </p>
            <a href="index.html">
                Voltar para o início
            </a>

        </div>

    </main>

<script src="login.js"></script>
    <script src="script.js"></script>

</body>

</html>
